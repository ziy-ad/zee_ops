name: more than one job
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
  
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: testing backend
        run: echo "Testing backend"        

  frontend:
    needs: backend
    runs-on: ubuntu-latest
  
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: testing backend
        run: echo "Testing frontend"